name: CPPUI CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  msvc-build:
    name: MSVC (Windows 2022, C++20)
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake (MSVC x64)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_CXX_STANDARD=20

      - name: Build All Targets (cppui_core, tests, examples)
        run: cmake --build build --config Release

      - name: Run CTest Suite
        run: ctest --test-dir build -C Release --output-on-failure --verbose

  clang-windows-build:
    name: Clang++ (Windows 2022, C++20)
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake (Clang++ with Ninja)
        run: cmake -B build -G "Ninja" -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20

      - name: Build All Targets
        run: cmake --build build

      - name: Run CTest Suite
        run: ctest --test-dir build --output-on-failure --verbose

  mingw-windows-build:
    name: MinGW GCC (Windows UCRT64, C++20)
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake

      - name: Configure CMake (MinGW GCC with Ninja)
        shell: msys2 {0}
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20

      - name: Build All Targets
        shell: msys2 {0}
        run: cmake --build build

      - name: Run CTest Suite
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure --verbose

  linux-gcc-build:
    name: GCC (Ubuntu Linux, C++20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure CMake (GCC with Ninja)
        run: cmake -B build -G "Ninja" -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20

      - name: Build All Targets
        run: cmake --build build

      - name: Run CTest Suite
        run: ctest --test-dir build --output-on-failure --verbose

  linux-clang-build:
    name: Clang++ (Ubuntu Linux, C++20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang

      - name: Configure CMake (Clang++ with Ninja)
        run: cmake -B build -G "Ninja" -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20

      - name: Build All Targets
        run: cmake --build build

      - name: Run CTest Suite
        run: ctest --test-dir build --output-on-failure --verbose

  macos-build:
    name: Apple Clang (macOS, C++20)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: brew install ninja

      - name: Configure CMake (Apple Clang with Ninja)
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20

      - name: Build All Targets
        run: cmake --build build

      - name: Run CTest Suite
        run: ctest --test-dir build --output-on-failure --verbose

  matrix-verification:
    name: Multi-Compiler Full Matrix Suite (60/60 Standards Verification)
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 for MinGW G++
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Run Multi-Compiler Multi-Standard Matrix Suite
        shell: powershell
        run: powershell.exe -ExecutionPolicy Bypass -File tests/run_matrix_suite.ps1
